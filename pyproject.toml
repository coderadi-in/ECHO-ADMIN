[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "request_engine", "urls"]

[project]
name = "echo-admin"
version = "0.1.0"
description = "Administrative CLI for the ECHO application."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "typer>=0.12.0",
]

[project.scripts]
echo-admin = "main:app"